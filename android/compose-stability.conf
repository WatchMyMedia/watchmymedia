// Classes the Compose compiler treats as stable, for every Compose module
// (wmm.android.compose). core:model isn't compiled by the Compose compiler, so
// without this it counts every model class as unstable.
//
// These are core:model's value types: data classes (and the sealed types made
// of them) whose properties are all val, and whose collections are read-only
// Lists and Maps that nothing changes after building. Enums need no entry.
//
// Listed by name, not as media.watchmy.client.model.*, because the package also
// holds types that are not values, left out on purpose:
// - the repositories, controllers and services (AppServices, AuthRepository,
//   CastGateway, CastReceiver, CastService, LibraryRepository,
//   PlaybackController, PlaybackControllerFactory, PlaybackGateway,
//   PreferencesRepository, RequestRepository, SeekThumbnails,
//   ServerRepository), which are live objects whose state changes;
// - CastedPlay and CastedLive, which hold live controllers;
// - ApiException, ServerTooOldException and SignedOutException: Throwables,
//   whose stack trace, cause and suppressed exceptions can change.
//
// A new value type in core:model goes here too; check it in the reports
// (-PcomposeCompilerReports=true, README "Build conventions").
