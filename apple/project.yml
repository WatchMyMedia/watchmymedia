# The Apple apps' Xcode project, generated by XcodeGen (`make apple-gen`): the
# iPhone and iPad app (App/) and the Apple TV app (TV/), one bundle ID for the
# universal purchase. The .xcodeproj and the Info.plists are generated and not
# committed. Every source folder is a synced folder, so Xcode picks up files
# added to or removed from it without regenerating; regenerate after changing
# this file.
name: WatchMyMedia
options:
  # Synced folders with excludes, without duplicate groups (2.45.4).
  minimumXcodeGenVersion: 2.45.4
  defaultSourceDirectoryType: syncedFolder
  bundleIdPrefix: media.watchmy
  deploymentTarget:
    iOS: "18.0"
    tvOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Placeholders. A release's version comes from its tag (scripts/version.sh):
    # `make apple-archive` passes it to xcodebuild, and
    # `make apple-gen VERSION=vX.Y.Z` writes it into the project for Xcode.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Eldwick Software LLC, as for the Mac app (PLAN-CLIENTS.md §4.5).
    DEVELOPMENT_TEAM: 6R8GZD78G3
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  WatchMyMediaKit:
    path: Kit
  GoogleCast:
    url: https://github.com/googlecast/google-cast-ios-sdk
    exactVersion: 4.8.6
targets:
  WatchMyMedia:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
    dependencies:
      - package: WatchMyMediaKit
        products: [WMMModel, WMMData, WMMPlayback, WMMDownloads, WMMUI, WMMFeatures, WMMCast]
      # The fakes are debug-only (PLAN-APPLE-REVIEW.md §2.9; apple/README.md):
      # built in every configuration so `import WMMFakes` resolves under
      # #if DEBUG, but linked only by Debug's OTHER_LDFLAGS, since Xcode links a
      # package product's whole object file and a Release binary would carry
      # their code. `make apple-build-release` checks it doesn't.
      - package: WatchMyMediaKit
        product: WMMFakes
        link: false
      - package: GoogleCast
        product: GoogleCastDynamic
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: WatchMyMedia
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Playback keeps going over AirPlay and in Picture in Picture with the phone locked.
        # fetch: a background refresh sends what was watched offline (the task below).
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [media.watchmy.client.sync]
        NSLocalNetworkUsageDescription: WatchMyMedia uses the local network to find and reach your WatchMyMedia server.
        NSBonjourServices: [_watchmymedia._tcp, _googlecast._tcp, _0A4D0B6A._googlecast._tcp]
        # Plain http to an IP address or a .local name (your own network); a host name needs https.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: media.watchmy.client
            CFBundleURLSchemes: [watchmymedia]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: media.watchmy.client
        PRODUCT_NAME: WatchMyMedia
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          OTHER_LDFLAGS: ["$(inherited)", "$(BUILT_PRODUCTS_DIR)/WMMFakes.o"]
    # Google ships GoogleCast.framework without a dSYM, so uploading an archive
    # warned "The archive did not include a dSYM for the GoogleCast.framework"
    # (1.5.8). dsymutil makes one from the embedded binary when archiving: it
    # carries the framework's UUID and symbol table, though Google's debug info
    # is not there to include. The files are listed for script sandboxing.
    postBuildScripts:
      - name: Make GoogleCast's dSYM
        runOnlyWhenInstalling: true
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/GoogleCast.framework/GoogleCast
        outputFiles:
          - $(DWARF_DSYM_FOLDER_PATH)/GoogleCast.framework.dSYM/Contents/Info.plist
          - $(DWARF_DSYM_FOLDER_PATH)/GoogleCast.framework.dSYM/Contents/Resources/DWARF/GoogleCast
          - $(DWARF_DSYM_FOLDER_PATH)/GoogleCast.framework.dSYM/Contents/Resources/Relocations/aarch64/GoogleCast.yml
        script: |
          # Warnings about Google's own object files, which aren't shipped, are dropped.
          xcrun dsymutil "$SCRIPT_INPUT_FILE_0" -o "$DWARF_DSYM_FOLDER_PATH/GoogleCast.framework.dSYM" 2>/dev/null
  # The Apple TV app (PLAN-IOS.md §11.2): its own 10-foot views in TV/ over the
  # same Kit, and the same bundle ID as the iPhone app for the universal purchase.
  WatchMyMedia TV:
    type: application
    platform: tvOS
    sources:
      - path: TV
        excludes:
          - Info.plist
    dependencies:
      - package: WatchMyMediaKit
        products: [WMMModel, WMMData, WMMPlayback, WMMUI, WMMFeatures]
      # Debug-only, as in the iPhone app.
      - package: WatchMyMediaKit
        product: WMMFakes
        link: false
    info:
      path: TV/Info.plist
      properties:
        CFBundleDisplayName: WatchMyMedia
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UIRequiredDeviceCapabilities: [arm64]
        NSLocalNetworkUsageDescription: WatchMyMedia uses the local network to find and reach your WatchMyMedia server.
        NSBonjourServices: [_watchmymedia._tcp]
        # Plain http to an IP address or a .local name (your own network); a host name needs https.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: media.watchmy.client
            CFBundleURLSchemes: [watchmymedia]
        # A YouTube trailer opens the YouTube app (PLAN-TRAILERS.md §6.3). Without
        # this, canOpenURL says no on a real Apple TV even with YouTube installed.
        LSApplicationQueriesSchemes: [youtube]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: media.watchmy.client
        PRODUCT_NAME: WatchMyMediaTV
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          OTHER_LDFLAGS: ["$(inherited)", "$(BUILT_PRODUCTS_DIR)/WMMFakes.o"]
  # The Apple TV app on the fakes, driven with the Siri Remote (TVUITests): make apple-tv-test-sim.
  WatchMyMediaTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources: [TVUITests]
    dependencies:
      - target: WatchMyMedia TV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: media.watchmy.client.tvuitests
        TEST_TARGET_NAME: WatchMyMedia TV
        GENERATE_INFOPLIST_FILE: YES
  WatchMyMediaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: WatchMyMedia
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: media.watchmy.client.uitests
        TEST_TARGET_NAME: WatchMyMedia
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WatchMyMedia:
    build:
      targets:
        WatchMyMedia: all
    run:
      config: Debug
      commandLineArguments:
        "-fakes": false
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - package: WatchMyMediaKit/WMMModelTests
        - package: WatchMyMediaKit/WMMDataTests
        - package: WatchMyMediaKit/WMMPlaybackTests
        - package: WatchMyMediaKit/WMMDownloadsTests
        - package: WatchMyMediaKit/WMMCastTests
        - package: WatchMyMediaKit/WMMFakesTests
        - package: WatchMyMediaKit/WMMUITests
        - package: WatchMyMediaKit/WMMFeaturesTests
    archive:
      config: Release
  # The Apple TV app: make apple-tv-build, make apple-tv-test-sim.
  WatchMyMedia TV:
    build:
      targets:
        WatchMyMedia TV: all
    run:
      config: Debug
      commandLineArguments:
        "-fakes": false
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - package: WatchMyMediaKit/WMMModelTests
        - package: WatchMyMediaKit/WMMDataTests
        - package: WatchMyMediaKit/WMMPlaybackTests
        - package: WatchMyMediaKit/WMMFakesTests
        - package: WatchMyMediaKit/WMMCastTests
        - package: WatchMyMediaKit/WMMUITests
        - package: WatchMyMediaKit/WMMFeaturesTests
        - WatchMyMediaTVUITests
    archive:
      config: Release
  # The app against a real server (UITests/EndToEndTests.swift): make apple-e2e.
  WatchMyMediaE2E:
    build:
      targets:
        WatchMyMedia: all
        WatchMyMediaUITests: [test]
    test:
      config: Debug
      targets:
        - WatchMyMediaUITests
