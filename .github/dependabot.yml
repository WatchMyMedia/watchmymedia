# Weekly update pull requests for the Android app's libraries and Gradle
# plugins and for the workflows' actions. The server's Go modules have their
# own process (make server-deps) and the web app's packages are updated by
# hand, so neither is here.
version: 2
updates:
  # Dependabot cannot update android/gradle/verification-metadata.xml, so its
  # Gradle pull requests fail CI's dependency verification until someone runs
  # `make android-verify-metadata` on the branch, reviews the new checksums and
  # pushes them (android/README.md, "Dependency verification").
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      androidx:
        patterns:
          - "androidx.*"
      libraries:
        patterns:
          - "*"

  # Workflows name each action by its commit with the release in a comment;
  # Dependabot moves both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"
