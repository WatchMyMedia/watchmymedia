version: "2"
linters:
  default: standard
  # Beyond the standard set: errors compared or formatted so errors.Is stops
  # working, swallowed errors, unclosed rows and bodies, requests without a
  # context, the Go modernizers (go fix applies them), and gosec.
  enable:
    - bodyclose
    - errorlint
    - gosec
    - modernize
    - nilerr
    - noctx
    - rowserrcheck
    - sqlclosecheck
  settings:
    gosec:
      excludes:
        - G115 # integer conversions of sizes, durations and counts that fit
        - G204 # ffmpeg and ffprobe run with argument lists, never a shell
        - G301 # data, cache and transcode folders are 0755 on purpose
        - G304 # file paths come from library roots and the data folder
  exclusions:
    generated: lax
    rules:
      # Closing response bodies and test fixtures: the error is not actionable,
      # and test requests need neither a context nor gosec's checks.
      - path: _test\.go
        linters: [errcheck, bodyclose, noctx, gosec]
