# A throwaway Radarr and Sonarr for testing the integrations (PLAN-ARR.md
# §15). They see the scratch library at /movies and /tv, other paths than the
# server sees, so path mappings are exercised. Nothing here downloads: there
# is no indexer or download client, and imports are made with the apps' own
# import of existing folders.
#
#   ARR_MEDIA=/path/to/scratch/media ARR_CONFIG=/path/to/scratch \
#     docker compose -f deploy/arr/compose.yaml -p wmm-arr-test up -d
#
# ARR_MEDIA holds movies/ and tv/; ARR_CONFIG gets radarr/ and sonarr/ with
# each app's config.xml, which holds its API key. A throwaway server on the
# host is http://host.docker.internal:<port> from inside the containers.
# Remove it all with `docker compose -p wmm-arr-test down` and the folders.
services:
  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls324
    environment:
      PUID: "${ARR_UID:-1000}"
      PGID: "${ARR_GID:-1000}"
      TZ: UTC
    volumes:
      - "${ARR_CONFIG}/radarr:/config"
      - "${ARR_MEDIA}/movies:/movies"
    ports:
      - "127.0.0.1:17878:7878"
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls2
    environment:
      PUID: "${ARR_UID:-1000}"
      PGID: "${ARR_GID:-1000}"
      TZ: UTC
    volumes:
      - "${ARR_CONFIG}/sonarr:/config"
      - "${ARR_MEDIA}/tv:/tv"
    ports:
      - "127.0.0.1:18989:8989"
