# The account the WatchMyMedia service runs as. render and video own the GPU
# devices under /dev/dri, so hardware transcoding needs no usermod.
# scripts/preinstall.sh makes the same account before the package unpacks:
# keep its copy of these lines the same (package_test.py checks).
u watchmymedia - "WatchMyMedia server" /var/lib/watchmymedia
m watchmymedia render
m watchmymedia video
